fragment BlogParts on Blog {
  __typename
  title
  excerpt
  featuredImage
  publishDate
  publish
  categories
  tags
  body
  seo {
    __typename
    title
    description
    image
  }
}

fragment PageParts on Page {
  __typename
  title
  excerpt
  publish
  body
  seo {
    __typename
    title
    description
  }
}

fragment ServiceParts on Service {
  __typename
  title
  excerpt
  icon
  link
  order
  body
}

fragment VideoParts on Video {
  __typename
  title
  videoUrl
  category
  thumbnail
  body
}

fragment BannerParts on Banner {
  __typename
  title
  image
  link
  order
  active
  body
}

fragment FeatureParts on Feature {
  __typename
  title
  description
  icon
  order
  active
  body
}

fragment HomepageParts on Homepage {
  __typename
  title
  hero {
    __typename
    heroTitle
    heroDescription
    heroImage
    heroOverlayOpacity
    heroButton1Text
    heroButton1Link
    heroButton2Text
    heroButton2Link
  }
  features {
    __typename
    featuresEyebrow
    featuresTitle
    featuresDescription
    featuresButtonText
    featuresButtonLink
  }
  mainCta {
    __typename
    mainCtaEyebrow
    mainCtaTitle
    mainCtaDescription
    mainCtaButtonText
    mainCtaButtonLink
  }
  footerCta {
    __typename
    footerCtaEyebrow
    footerCtaTitle
    footerCtaDescription
    footerCtaButtonText
    footerCtaButtonLink
  }
  recentPosts {
    __typename
    recentPostsEyebrow
    recentPostsTitle
    recentPostsDescription
    recentPostsButtonText
    recentPostsButtonLink
    recentPostsCount
  }
  seo {
    __typename
    seoTitle
    seoDescription
  }
  body
}
